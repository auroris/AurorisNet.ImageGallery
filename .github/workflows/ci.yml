name: CI

# Builds each pull request, and merges a Dependabot update that builds. An update of a package the application
# references then starts the Release workflow. The repository has no test project yet, so the build is the check.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  test:
    name: Build
    # The application reads NTFS alternate data streams and bundles ffmpeg.exe, so it builds and runs on Windows only.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish the application
        run: dotnet publish ImageGallery/ImageGallery.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish

  # A workflow that runs for Dependabot gets a read-only token unless the job asks for more.
  dependabot:
    name: Merge Dependabot update
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: auroris/AurorisNet.Build/actions/dependabot-release@main
        with:
          shipped-projects: ImageGallery
