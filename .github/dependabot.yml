# Dependabot opens the pull requests that .github/workflows/ci.yml builds and merges. An update of a package the
# application references then starts the Release workflow, as docs/releasing.md in auroris/AurorisNet.Build describes.
# The workflows pin each action to a commit; Dependabot updates the commit and the version in the comment beside it.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    ignore:
      # These packages follow the .NET version the project targets, so a new major version waits for that upgrade.
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - "version-update:semver-major"
    groups:
      # Magick.NET is the first dependency the application follows: it reads and writes every image, and its releases
      # carry ImageMagick's security fixes. It gets a pull request of its own, so each of its releases becomes a release
      # here.
      magick:
        patterns:
          - "Magick.NET*"
      # The FFmpeg tools come from auroris/AurorisNet.ImageGallery.FFmpeg, whose version is the FFmpeg release. Each
      # of its releases also becomes a release here, once the video check in ci.yml has passed on it.
      ffmpeg:
        patterns:
          - "AurorisNet.ImageGallery.FFmpeg"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Magick.NET*"
          - "AurorisNet.ImageGallery.FFmpeg"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
